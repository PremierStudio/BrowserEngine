name: CI

on: push

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - name: Install dependencies
        run: npm ci

      - name: Full gates (typecheck, lint, format, knip, tests, coverage, mutation)
        run: npm run ci

      - name: Build
        run: npm run build

      - name: Compile fixture via CLI
        run: node dist/cli.js compile tests/fixtures/login.flow.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: reports-${{ github.sha }}
          path: |
            reports/
            coverage/
          retention-days: 14
