<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserEngine</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="mark">BE</div>
          <div class="brand-copy">
            <strong>BROWSERENGINE</strong>
            <span id="line">Checking…</span>
          </div>
        </div>
      </header>
      <div class="popup-stats">
        <div class="stat"><span>Host</span><b id="host">…</b></div>
        <div class="stat"><span>Engine</span><b id="engine">…</b></div>
        <div class="stat"><span>Attach</span><b id="attach">…</b></div>
      </div>
      <div class="actions" style="padding: 12px 16px 14px">
        <button class="btn primary" id="open" type="button">Open cockpit</button>
        <button class="btn danger" id="kill" type="button">Pause</button>
        <button class="btn" id="resume" type="button" hidden>Resume</button>
        <button class="btn" id="options" type="button">Settings</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
