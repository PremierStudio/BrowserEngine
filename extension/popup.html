<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>BrowserEngine</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="mark" aria-hidden="true">BE</div>
          <div class="brand-copy">
            <strong>BROWSERENGINE</strong>
          </div>
        </div>
        <span class="pill" id="statePill">
          <span class="dot" id="stateDot" aria-hidden="true"></span>
          <span id="stateText">…</span>
        </span>
      </header>
      <main class="content">
        <p class="status-line" id="line" role="status" aria-live="polite">Checking…</p>
        <button class="btn primary block" id="open" type="button">Open cockpit</button>
        <div class="actions">
          <button class="btn danger" id="kill" type="button" aria-pressed="false">Pause</button>
          <button class="btn" id="resume" type="button" aria-pressed="false" hidden>Resume</button>
          <button class="btn" id="options" type="button">Settings</button>
        </div>
        <div class="status-row" aria-label="Connection status">
          <span class="status-item">
            <span class="dot" id="hostDot" aria-hidden="true"></span>
            <span class="status-label">Host</span>
            <span class="status-value" id="host">…</span>
          </span>
          <span class="status-item">
            <span class="dot" id="engineDot" aria-hidden="true"></span>
            <span class="status-label">Engine</span>
            <span class="status-value" id="engine">…</span>
          </span>
          <span class="status-item">
            <span class="dot" id="attachDot" aria-hidden="true"></span>
            <span class="status-label">Attach</span>
            <span class="status-value" id="attach">…</span>
          </span>
        </div>
        <p class="hint">
          <span class="kbd">Ctrl+Shift+E</span><span>cockpit</span>
          <span aria-hidden="true">·</span>
          <span class="kbd">Ctrl+Shift+U</span><span>pause</span>
        </p>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
