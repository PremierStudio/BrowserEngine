<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>BrowserEngine cockpit</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="app">
    <div class="wrap cockpit">
      <div class="cockpit-sticky">
        <header class="top cockpit-top">
          <div class="brand">
            <div class="mark" aria-hidden="true">BE</div>
            <div class="brand-copy">
              <strong>BROWSERENGINE</strong>
              <span id="subtitle" role="status" aria-live="polite">Cockpit</span>
            </div>
          </div>
          <div class="actions cockpit-actions">
            <button class="btn" id="resume" type="button" hidden>Resume</button>
            <button class="btn danger" id="kill" type="button" title="Pause and detach">
              Pause
            </button>
            <button
              class="btn ghost icon"
              id="options"
              type="button"
              title="Settings"
              aria-label="Open settings"
            >
              ⚙︎
            </button>
          </div>
        </header>
        <section class="status-rail" aria-label="Connection status">
          <div class="pill status-pill" title="Native host">
            <span class="dot" id="hostDot" aria-hidden="true"></span>
            <span class="status-key">Host</span>
            <span class="status-value" id="hostText">…</span>
          </div>
          <div class="pill status-pill" title="Engine socket">
            <span class="dot" id="engineDot" aria-hidden="true"></span>
            <span class="status-key">Engine</span>
            <span class="status-value" id="engineText">…</span>
          </div>
          <div class="pill status-pill" title="Attached tab">
            <span class="dot" id="attachDot" aria-hidden="true"></span>
            <span class="status-key">Attach</span>
            <span class="status-value" id="attachText">none</span>
          </div>
          <div class="pill status-pill" title="Attach policy">
            <span class="status-key">Policy</span>
            <span class="status-value" id="policy">—</span>
          </div>
          <button class="btn tiny ghost" id="detach" type="button" title="Detach from the tab">
            Detach
          </button>
        </section>
      </div>
      <main class="cockpit-body">
        <section class="card pending" id="pendingCard" hidden aria-labelledby="pendingTitle">
          <div class="card-head">
            <h2 id="pendingTitle">Attach request</h2>
            <span class="pill">
              <span class="dot warn" aria-hidden="true"></span>
              Needs approval
            </span>
          </div>
          <div class="card-body pending-body">
            <div class="pending-target">
              <strong class="tab-title" id="pendingText"></strong>
              <span class="url" id="pendingOrigin"></span>
            </div>
            <div class="actions pending-actions">
              <button class="btn primary" id="allow" type="button">Allow origin</button>
              <button class="btn ghost" id="deny" type="button">Deny</button>
            </div>
          </div>
        </section>
        <section class="card" aria-labelledby="tabsTitle">
          <div class="card-head">
            <h2 id="tabsTitle">Tabs</h2>
            <span class="count" id="tabCount" title="Visible tabs">0</span>
          </div>
          <div class="card-body stack">
            <div class="search">
              <input
                class="input"
                id="tabQuery"
                type="search"
                placeholder="Filter title or host"
                aria-label="Filter tabs"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div class="input-row">
              <input
                class="input mono"
                id="newTabUrl"
                type="text"
                placeholder="https:// — open a new tab"
                aria-label="URL for the new tab"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="btn primary" id="newTab" type="button">Open</button>
            </div>
            <div class="tab-list" id="tabs"></div>
          </div>
        </section>
        <section class="card" aria-labelledby="originsTitle">
          <div class="card-head">
            <h2 id="originsTitle">Allowed origins</h2>
          </div>
          <div class="card-body stack">
            <div class="chips" id="origins"></div>
            <div class="input-row">
              <input
                class="input mono"
                id="originInput"
                type="text"
                placeholder="https://example.com or https://*"
                aria-label="Origin to allow"
                autocomplete="off"
                spellcheck="false"
              />
              <button class="btn" id="addOrigin" type="button">Allow</button>
            </div>
          </div>
        </section>
        <section class="card" aria-labelledby="activityTitle">
          <div class="card-head">
            <h2 id="activityTitle">Activity</h2>
          </div>
          <div class="card-body">
            <div class="activity" id="activity"></div>
          </div>
        </section>
      </main>
      <footer class="cockpit-foot">
        <p class="toast">
          New hosts prompt here <span class="kbd">Ctrl+Shift+E</span> panel
          <span class="kbd">Ctrl+Shift+U</span> pause
        </p>
      </footer>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
