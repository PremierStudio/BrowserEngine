name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Full gates (typecheck, lint, format, knip, tests, coverage, mutation)
        run: npm run ci

  publish:
    needs: gates
    runs-on: ubuntu-latest
    # Must match the GitHub Environment named in the npm trusted-publisher config.
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Publish
        run: npm publish --access public --provenance

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
