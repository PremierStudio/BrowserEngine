name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript-only (no .js/.mjs/.cjs outside generated dirs)
        shell: bash
        run: |
          ! git ls-files | grep -E '\.(js|mjs|cjs)$' || exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Knip (dead code / unused deps)
        run: npm run knip

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Compile fixture via CLI
        run: node dist/cli.js compile tests/fixtures/login.flow.json

      - name: Click-go smoke (real Chrome, local HTML)
        run: node dist/testing/clickGoMain.js
        env:
          BROWSER_ENGINE_HEADED: '0'
          BROWSER_ENGINE_NO_SANDBOX: '1'

      - name: Coverage (100% gate)
        run: npm run coverage

      - name: Restore incremental mutation report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-

      - name: Mutation (100% gate + survivor registry)
        run: npm run ci:survivors

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            coverage/
          retention-days: 14
